name: Build and Push jip-eonje

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

concurrency:
  group: jip-eonje-main
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dongmin3891/jip-eonje:${{ github.sha }}
            ghcr.io/dongmin3891/jip-eonje:latest
      - name: Update desired image
        run: |
          sed -i 's|image: ghcr.io/dongmin3891/jip-eonje:.*|image: ghcr.io/dongmin3891/jip-eonje:${{ github.sha }}|' k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ops: deploy ${{ github.sha }}"
            git push
          fi
