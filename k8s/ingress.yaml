apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jip-eonje-ingress
  namespace: jip-eonje
spec:
  ingressClassName: traefik
  rules:
    - host: jip.ddongmy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jip-eonje-service
                port:
                  number: 80
  tls:
    - hosts:
        - jip.ddongmy.com
      secretName: jip-eonje-tls
